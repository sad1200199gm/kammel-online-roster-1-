<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتصلون — كمّل الكلمة</title><style>*{box-sizing:border-box}body{margin:0;padding:1rem;background:#131a30;color:#fff;font:17px/1.55 system-ui,sans-serif}main{max-width:740px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}a{color:#c8e1ff}h1,h2,p{margin:.35em 0}.lead,.team{padding:1rem;border-radius:16px;background:#222e50;border:1px solid #8397c7;margin:.65rem 0;overflow-wrap:anywhere}.lead{border-color:#e6fa88}.lead h2{color:#e6fa88}.teams{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}.team.a{border-color:#78b8ff}.team.b{border-color:#ffa97c}ul{margin:.4rem 0;padding-inline-start:1.3rem}li::marker{color:#9ce5c8}.muted{color:#cdd9f5}[hidden]{display:none!important}#cardNotice{position:fixed;z-index:20;inset-block-start:max(.6rem,env(safe-area-inset-top));inset-inline:0;margin-inline:auto;width:min(calc(100% - 1rem),29rem);display:flex;align-items:center;gap:.7rem;padding:.68rem .7rem;background:#211e16;color:#fff4ce;border:1px solid #f5c746;border-radius:15px;box-shadow:0 5px 22px #0008;text-align:start}#cardNotice[hidden]{display:none!important}.cardGesture{position:relative;flex:0 0 2.7rem;height:3.3rem}.cardGesture i{position:absolute;inset-inline-start:.52rem;top:0;width:1.6rem;height:2.15rem;border-radius:4px;background:#ffd64e;border:2px solid #fff1a2;transform:rotate(-9deg)}.cardGesture span{position:absolute;bottom:-.1rem;inset-inline-start:.1rem;font-size:1.55rem}.cardGesture.raise{animation:cardRaise .55s ease-out both}@keyframes cardRaise{from{opacity:0;transform:translateY(12px) rotate(10deg)}to{opacity:1;transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){.cardGesture.raise{animation:none}}.cardCopy{min-width:0;flex:1;overflow-wrap:anywhere}.cardCopy strong{color:#ffda65}.cardCopy div{font-size:.88rem}#dismissCard{background:#493e27;color:#fff4ce;border:0;border-radius:8px;min-width:40px;min-height:40px;font-size:1.15rem;cursor:pointer}.yellowAction{background:#f9d967;color:#252012}</style><main><header><h1>اللاعبون المتصلون</h1><a id="back">الرجوع للعبة</a></header><p id="notice" role="status" class="muted">جارٍ تحميل القائمة…</p><div id="roster" hidden><p id="room"></p><section class="lead"><h2>قائد اللعبة</h2><p id="leader"></p><p class="muted">القائد ما ينحسب ضمن أي فريق.</p></section><div class="teams"><section class="team a"><h2 id="titleA">فريق أ</h2><p id="emptyA" class="muted">ما فيه لاعبين متصلين.</p><ul id="listA"></ul></section><section class="team b"><h2 id="titleB">فريق ب</h2><p id="emptyB" class="muted">ما فيه لاعبين متصلين.</p><ul id="listB"></ul></section></div></div><aside id="cardNotice" hidden role="status" aria-live="polite" aria-atomic="true"><div class="cardGesture" aria-hidden="true"><i></i><span>✊</span></div><div class="cardCopy"><strong id="cardHeadline"></strong><div id="cardPlayer"></div><div id="cardRemaining"></div></div><button type="button" id="dismissCard" aria-label="إخفاء إشعار الكرت">×</button></aside></main><script>
'use strict';const $=id=>document.getElementById(id),[,team,code]=location.pathname.split('/').filter(Boolean),hostView=!team&&new URLSearchParams(location.search).has('admin');let token='';try{token=hostView?'':(localStorage.getItem(team?'kammel:'+team+':'+code:'kammel:direct')||sessionStorage.getItem(team?'kammel:'+team+':'+code:'kammel:direct')||'');}catch{}$('back').href=hostView?'/host':!team?'/':'/join/'+encodeURIComponent(team)+'/'+encodeURIComponent(code);let snapshot='';
function draw(j){showCards(j.cardEvents);$('roster').hidden=false;$('notice').textContent='القائمة تتحدّث تلقائيًا.';const key=JSON.stringify(j);if(key===snapshot)return;snapshot=key;$('leader').textContent=j.room.leader;$('room').textContent='الغرفة: '+j.room.name;for(const [team,label,letter] of [['a','أ','A'],['b','ب','B']]){const online=j.players.filter(p=>p.team===team&&p.online);$('title'+letter).textContent='فريق '+label+' · '+online.length.toLocaleString('ar-SA');$('empty'+letter).hidden=Boolean(online.length);const list=$('list'+letter);list.replaceChildren();for(const p of online){const li=document.createElement('li');li.textContent=p.name;list.append(li);}}}
async function refresh(){if(!hostView&&!token){$('notice').textContent='القائمة تظهر بعد قبول طلب انضمامك.';return;}try{const r=await fetch('/api/roster',{headers:token?{Authorization:'Bearer '+token}:{},signal:AbortSignal.timeout(5000)});if(r.status===403){$('roster').hidden=true;$('notice').textContent='القائمة متاحة فقط للقائد واللاعبين المقبولين.';return;}if(!r.ok)throw new Error();draw(await r.json());}catch{$('roster').hidden=true;$('notice').textContent='تعذّر الاتصال مؤقتًا. نحاول مرة ثانية…';}setTimeout(refresh,3000);}
const seenCards=new Set(),cardQueue=[];let cardTimer=0;
function showCards(events){for(const e of events||[]){if(!e?.id||seenCards.has(e.id))continue;seenCards.add(e.id);cardQueue.push(e);}if(!cardTimer)nextCard();}
function nextCard(){const e=cardQueue.shift(),box=document.getElementById('cardNotice');if(!e){cardTimer=0;box.hidden=true;return;}const team=e.team==='a'?'أ':'ب';document.getElementById('cardHeadline').textContent='كرت أصفر لفريق '+team;document.getElementById('cardPlayer').textContent='اللاعب: '+e.name;document.getElementById('cardRemaining').textContent=e.count===1?'باقي كرتين قبل الطرد.':e.count===2?'باقي كرت واحد قبل الطرد.':'الكرت الثالث — تم طرد اللاعب من اللعبة.';box.hidden=false;const icon=box.querySelector('.cardGesture');icon.classList.remove('raise');void icon.offsetWidth;icon.classList.add('raise');cardTimer=setTimeout(nextCard,5000);}
document.getElementById('dismissCard').onclick=()=>{clearTimeout(cardTimer);nextCard();};
refresh();
</script></html>
